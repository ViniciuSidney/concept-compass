<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Organizador de Conteúdos — aplicação local para organizar Matérias, Temas e Assuntos."
    />
    <meta name="theme-color" content="#4f46e5" />
    <script>
      (() => {
        const root = document.documentElement;
        let choice = 'system';

        try {
          const raw = localStorage.getItem('organizador-conteudos:preferences');
          const storedTheme = raw ? JSON.parse(raw).theme : 'system';
          if (storedTheme === 'light' || storedTheme === 'dark' || storedTheme === 'system') {
            choice = storedTheme;
          }
        } catch {
          choice = 'system';
        }

        const resolved =
          choice === 'system'
            ? window.matchMedia?.('(prefers-color-scheme: dark)').matches
              ? 'dark'
              : 'light'
            : choice;

        if (choice === 'light' || choice === 'dark') root.dataset.theme = choice;
        root.dataset.themeChoice = choice;
        root.dataset.resolvedTheme = resolved;
        root.style.colorScheme = resolved;
        document
          .querySelector('meta[name="theme-color"]')
          ?.setAttribute('content', resolved === 'dark' ? '#10111b' : '#f5f6fb');
      })();
    </script>
    <title>Visão Geral — Organizador de Conteúdos</title>
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <link rel="manifest" href="./manifest.webmanifest" />

    <link rel="stylesheet" href="./src/styles/tokens.css" />

    <link rel="stylesheet" href="./src/styles/components/content.css" />
    <link rel="stylesheet" href="./src/styles/components/feedback.css" />
    <link rel="stylesheet" href="./src/styles/components/overlays.css" />
    <link rel="stylesheet" href="./src/styles/pages/placeholders.css" />
    <link rel="stylesheet" href="./src/styles/pages/m3-showcase.css" />
    <link rel="stylesheet" href="./src/styles/pages/dashboard.css" />
    <link rel="stylesheet" href="./src/styles/pages/materias.css" />
